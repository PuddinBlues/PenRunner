# Sviluppo locale: Postgres 16.
#   docker compose up -d
#   pnpm db:migrate && pnpm db:seed
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: penrunner
      POSTGRES_PASSWORD: penrunner
      POSTGRES_DB: penrunner
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penrunner -d penrunner"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
